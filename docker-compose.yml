services:
  postgres:
    image: postgres:16-alpine
    container_name: cte-postgres
    environment:
      POSTGRES_USER: cte
      POSTGRES_PASSWORD: cte_dev_password
      POSTGRES_DB: code_to_escape
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cte -d code_to_escape']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cte-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  code-runner-sandbox:
    build:
      context: .
      dockerfile: docker/code-runner/sandbox.Dockerfile
    image: code-to-escape/sandbox:latest
    entrypoint: ['true']
    restart: 'no'

  code-runner:
    build:
      context: .
      dockerfile: docker/code-runner/Dockerfile
    container_name: cte-code-runner
    environment:
      PORT: 3002
      CODE_RUNNER_BIND_HOST: 0.0.0.0
      CODE_RUNNER_TOKEN: ${CODE_RUNNER_TOKEN:-code-to-escape-dev-runner-token}
      CODE_RUNNER_IMAGE: code-to-escape/sandbox:latest
    ports:
      - '127.0.0.1:3002:3002'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    depends_on:
      redis:
        condition: service_healthy
      code-runner-sandbox:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
