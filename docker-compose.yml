services:
  postgres:
    image: postgres:16-alpine
    container_name: cte-postgres
    environment:
      POSTGRES_USER: cte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cte_dev_password}
      POSTGRES_DB: code_to_escape
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cte -d code_to_escape']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cte-redis
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5


  code-runner-sandbox:
    build:
      context: .
      dockerfile: docker/code-runner/sandbox.Dockerfile
    image: code-to-escape/sandbox:latest
    entrypoint: ['true']
    restart: 'no'

  code-runner:
    build:
      context: .
      dockerfile: docker/code-runner/Dockerfile
    container_name: cte-code-runner
    environment:
      PORT: 3002
      CODE_RUNNER_BIND_HOST: 0.0.0.0
      CODE_RUNNER_TOKEN: ${CODE_RUNNER_TOKEN:-code-to-escape-dev-runner-token}
      CODE_RUNNER_IMAGE: code-to-escape/sandbox:latest
    ports:
      - '127.0.0.1:3002:3002'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    depends_on:
      redis:
        condition: service_healthy
      code-runner-sandbox:
        condition: service_completed_successfully

  # The API process. Submissions are enqueued to Redis; the worker below drains
  # them. Both are required for the Submit button to produce a result.
  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    container_name: cte-server
    # required: false so a fresh checkout without a .env still validates
    # (the CI "docker compose config" job has no .env). Everything the server
    # truly needs is also listed explicitly below.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://cte:${POSTGRES_PASSWORD:-cte_dev_password}@postgres:5432/code_to_escape
      REDIS_URL: redis://redis:6379
      CODE_RUNNER_URL: http://code-runner:3002
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # Behind the reverse proxy we must trust exactly one hop so rate limiting
      # keys on the real client IP.
      TRUST_PROXY_HOPS: '1'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      code-runner:
        condition: service_started

  # Separate process: drains the execution queue and judges submissions.
  worker:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    container_name: cte-worker
    command: ['node', 'dist/worker.js']
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://cte:${POSTGRES_PASSWORD:-cte_dev_password}@postgres:5432/code_to_escape
      REDIS_URL: redis://redis:6379
      CODE_RUNNER_URL: http://code-runner:3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      code-runner:
        condition: service_started

  # The built game client, served as static files. It calls the API at relative
  # paths (`/api/v1`) and opens sockets same-origin, so it must share an origin
  # with the API — which is what nginx below provides.
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: cte-web
    restart: unless-stopped

  # Single public entrypoint. Routes /api and /socket.io to the server and
  # everything else to the SPA, so the browser sees one origin and the
  # TRUST_PROXY_HOPS=1 setting above is truthful.
  nginx:
    image: nginx:1.27-alpine
    container_name: cte-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '8080:80'
    depends_on:
      server:
        condition: service_started
      web:
        condition: service_started

volumes:
  postgres_data:
  redis_data:

