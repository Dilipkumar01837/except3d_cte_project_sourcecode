services:
  postgres:
    image: postgres:16-alpine
    container_name: cte-postgres
    environment:
      POSTGRES_USER: cte
      POSTGRES_PASSWORD: cte_dev_password
      POSTGRES_DB: code_to_escape
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cte -d code_to_escape']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cte-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
