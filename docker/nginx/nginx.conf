events {
  worker_connections 1024;
}

http {
  # Canonical API port is 3000 (see apps/server and docker-compose.yml).
  # This previously pointed at server:3001, which nothing listens on, so every
  # proxied request through nginx failed to connect.
  upstream api {
    server server:3000;
  }

  # The web image serves the built SPA from nginx's default port 80, not the Vite
  # dev server's 5173.
  upstream web {
    server web:80;
  }

  server {
    listen 80;

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    location /socket.io/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
